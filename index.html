<html>

    <style>
      /* 1. 頂部載入進度條樣式 */
      #progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        background-color: #3b82f6;
        width: 0%;
        transition: width 0.15s ease-out, opacity 0.3s ease-in;
        z-index: 10000;
        opacity: 0;
      }

      /* 2. 遮罩視窗與圓形進度條樣式 */
      .modal {
        display: none; 
        position: fixed;
        z-index: 1000;
        left: 0; top: 0;
        width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.5); 
        justify-content: center;
        align-items: center;
      }

      .modal-content2 {
        background-color: #fff;
        margin: auto;
        padding: 40px;
        border-radius: 8px;
        width: 300px;
        text-align: center;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .progress-ring-wrapper {
        position: relative;
        width: 90px;
        height: 90px;
        margin: 0 auto 12px auto;
      }
      .progress-ring-svg {
        transform: rotate(-90deg);
      }
      .progress-ring-circle {
        transition: stroke-dashoffset 0.15s ease-out;
        stroke-linecap: round;
      }
      .progress-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 18px;
        font-weight: bold;
        color: #1f2937;
      }

      a {
        font-size: 24px;
      }

      p {
        font-size: 24px; 
      }

      h1 {
        font-size: 50px;
        color: blue;
      }

      h4 {
        font-size: 50px;
        color: black;
      }

      h3 {
        font-size: 50px;
        color: #FFD700;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }

      th, td {
        border: 1px solid #333;
        padding: 8px;
        text-align: center;
      }

      .container {
        width: 600px;
        margin: 0 auto;
        text-align: center;
      }

      .checkbox-container {
        margin-bottom: 10px;
      }

      .input-group {
        width: 60%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 12px auto;
        gap: 20px;
      }

      .input-group label {
        width: 70px;
        text-align: left;
        font-size: 24px;
        flex: none;
      }

      .input-group input[type="number"] {
        width: 100px !important;
        max-width: 90px !important;
        height: 40px !important;
        font-size: 24px;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 0 !important;
      }

      label {
        flex: 1;
        text-align: left;
        cursor: pointer;
      }

      input[type="submit"], .back-button {
        width: 65.5%;
        padding: 10px;
        font-size: 20px;
        font-weight: bold;
        background-color: #4A4AFF;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 30px;
      }
        
      #totalScore {
        font-size: 18px;
        font-weight: bold;
        margin-top: 10px;
      }

      .hidden {

      .checkbox-container {

      #checkboxForm label {

      #checkboxButton {
        display: flex;
        flex-direction: row;
        gap: 10px;
        align-items: center;
        margin-left: 10px;
        font-size: 20px;
      }

      .button-medium {
        font-size: 20px;
        padding: 10px 20px;
      }

      input[type="checkbox"] {
        pointer-events: auto;
      }

    <script>
      var ids114 = [
        "year114_1", "score114_1", "people114_1", "pr114_1",
        "year114_2", "score114_2", "people114_2", "pr114_2",
        "year114_3", "score114_3", "people114_3", "pr114_3"
      ];

      var ids113 = [
        "year113_1", "score113_1", "people113_1", "pr113_1",
        "year113_2", "score113_2", "people113_2", "pr113_2",
        "year113_3", "score113_3", "people113_3", "pr113_3"
      ];

      var ids112 = [
        "year112_1", "score112_1", "people112_1", "pr112_1",
        "year112_2", "score112_2", "people112_2", "pr112_2",
        "year112_3", "score112_3", "people112_3", "pr112_3"
      ];

      var reids114 = [
        "#year114_1", "#score114_1", "#people114_1", "#pr114_1",
        "#year114_2", "#score114_2", "#people114_2", "#pr114_2",
        "#year114_3", "#score114_3", "#people114_3", "#pr114_3"
      ];

      var reids113 = [
        "#year113_1", "#score113_1", "#people113_1", "#pr113_1",
        "#year113_2", "#score113_2", "#people113_2", "#pr113_2",
        "#year113_3", "#score113_3", "#people113_3", "#pr113_3"
      ];

      var reids112 = [
        "#year112_1", "#score112_1", "#people112_1", "#pr112_1",
        "#year112_2", "#score112_2", "#people112_2", "#pr112_2",
        "#year112_3", "#score112_3", "#people112_3", "#pr112_3"
      ];

      for(let i=0; i<12; i=i+4) {
        document.getElementById(ids114[i]).textContent = "115";
        document.getElementById(ids114[i+1]).textContent = "";
        document.getElementById(ids114[i+2]).textContent = "";
        document.getElementById(ids114[i+3]).textContent = "";

        document.getElementById(ids113[i]).textContent = "114";
        document.getElementById(ids113[i+1]).textContent = "";
        document.getElementById(ids113[i+2]).textContent = "";
        document.getElementById(ids113[i+3]).textContent = "";
        
        document.getElementById(ids112[i]).textContent = "113";
        document.getElementById(ids112[i+1]).textContent = "";
        document.getElementById(ids112[i+2]).textContent = "";
        document.getElementById(ids112[i+3]).textContent = "";
      }

      document.getElementById('team').textContent = "組合";
      document.getElementById('Choose').textContent = "";

      var score_114_1 = {};
      var score_114_2 = {};
      var score_114_3 = {};
      var score_114_4 = {};
      var data_114 = [];
      var data_113 = [];
      var data_112 = [];
      var ans = [];
      var choose = "";

      // ================= 圓形進度條與非同步控制器 =================
      const progressBar = document.getElementById('progress-bar');
      const loadingModal = document.getElementById('loadingModal');
      const loadingModalContent = document.getElementById('loadingModalContent');
      let progressTimer = null;

      const RADIUS = 35;
      const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

      function setCircleProgress(percent) {
        const circle = document.getElementById('progress-circle');
        const text = document.getElementById('progress-text');
        if (!circle || !text) return;
        const clamped = Math.min(100, Math.max(0, Math.round(percent)));
        const offset = CIRCUMFERENCE - (clamped / 100) * CIRCUMFERENCE;
        circle.style.strokeDashoffset = offset;
        text.textContent = clamped + '%';
      }

      async function runWithProgressModal(asyncTask, loadingText = "載入中，請稍候...") {
        loadingModalContent.innerHTML = `
          <div class="progress-ring-wrapper">
            <svg class="progress-ring-svg" width="90" height="90">
              <circle stroke="#e5e7eb" stroke-width="6" fill="transparent" r="${RADIUS}" cx="45" cy="45"/>
              <circle id="progress-circle" class="progress-ring-circle"
                stroke="#3b82f6" stroke-width="6" fill="transparent" r="${RADIUS}" cx="45" cy="45"
                style="stroke-dasharray: ${CIRCUMFERENCE} ${CIRCUMFERENCE}; stroke-dashoffset: ${CIRCUMFERENCE};" />
            </svg>
            <div id="progress-text" class="progress-text">0%</div>
          </div>
          <p style="margin: 0; color: #4b5563; font-size: 16px;">${loadingText}</p>
        `;
        loadingModal.style.display = 'flex';

        progressBar.style.opacity = '1';
        progressBar.style.width = '0%';
        let currentPercent = 0;
        if (progressTimer) clearInterval(progressTimer);

        progressTimer = setInterval(() => {
          if (currentPercent < 99) {
            const step = (99 - currentPercent) * 0.1 + Math.random() * 3;
            currentPercent = Math.min(99, currentPercent + step);
            progressBar.style.width = currentPercent + '%';
            setCircleProgress(currentPercent);
          }
        }, 120);

        try {
          await asyncTask();
        } catch (error) {
          console.error("執行發生錯誤：", error);
        } finally {
          clearInterval(progressTimer);
          progressBar.style.width = '100%';
          setCircleProgress(100);

          await new Promise(resolve => setTimeout(resolve, 400));

          loadingModal.style.display = 'none';
          progressBar.style.opacity = '0';
          setTimeout(() => {
            progressBar.style.width = '0%';
          }, 300);
        }
      }

      // 取得輸入值與 API 查詢
      document.getElementById("find_btn").addEventListener("click", async function(event) {
        score_114_1["國文"] = Number(document.getElementById('chinese').value || 0);
        score_114_1["英文"] = Number(document.getElementById('english').value || 0);
        score_114_1["數學A"] = Number(document.getElementById('mathA').value || 0);
        score_114_1["數學B"] = Number(document.getElementById('mathB').value || 0);
        score_114_1["自然"] = Number(document.getElementById('science').value || 0);
        score_114_1["社會"] = Number(document.getElementById('social').value || 0);
        
        var message =
          "請確認輸入的成績：\n" +
          "國文: " + score_114_1["國文"] + "\n" +
          "英文: " + score_114_1["英文"] + "\n" +
          "數學A: " + score_114_1["數學A"] + "\n" +
          "數學B: " + score_114_1["數學B"] + "\n" +
          "自然: " + score_114_1["自然"] + "\n" +
          "社會: " + score_114_1["社會"] + "\n\n" +
          "確認後將無法修改，確定要提交嗎？\n"+
          "按下確認後請等待網頁計算";

        if (!confirm(message)) {
          return;
        }  

        // 2科成績總和
        score_114_2["國文、英文"] = score_114_1["國文"] + score_114_1["英文"];
        score_114_2["國文、數學A"] = score_114_1["國文"] + score_114_1["數學A"];
        score_114_2["國文、數學B"] = score_114_1["國文"] + score_114_1["數學B"];
        score_114_2["國文、社會"] = score_114_1["國文"] + score_114_1["社會"];
        score_114_2["國文、自然"] = score_114_1["國文"] + score_114_1["自然"];
        score_114_2["英文、數學A"] = score_114_1["英文"] + score_114_1["數學A"];
        score_114_2["英文、數學B"] = score_114_1["英文"] + score_114_1["數學B"];
        score_114_2["英文、社會"] = score_114_1["英文"] + score_114_1["社會"];
        score_114_2["英文、自然"] = score_114_1["英文"] + score_114_1["自然"];
        score_114_2["數學A、社會"] = score_114_1["數學A"] + score_114_1["社會"];
        score_114_2["數學A、自然"] = score_114_1["數學A"] + score_114_1["自然"];
        score_114_2["數學B、社會"] = score_114_1["數學B"] + score_114_1["社會"];
        score_114_2["數學B、自然"] = score_114_1["數學B"] + score_114_1["自然"];
        score_114_2["社會、自然"] = score_114_1["社會"] + score_114_1["自然"];

        // 3科成績總和
        score_114_3["國文、英文、數學A"] = score_114_1["國文"] + score_114_1["英文"] + score_114_1["數學A"];
        score_114_3["國文、英文、數學B"] = score_114_1["國文"] + score_114_1["英文"] + score_114_1["數學B"];
        score_114_3["國文、英文、社會"] = score_114_1["國文"] + score_114_1["英文"] + score_114_1["社會"];
        score_114_3["國文、英文、自然"] = score_114_1["國文"] + score_114_1["英文"] + score_114_1["自然"];
        score_114_3["國文、數學A、社會"] = score_114_1["國文"] + score_114_1["數學A"] + score_114_1["社會"];
        score_114_3["國文、數學A、自然"] = score_114_1["國文"] + score_114_1["數學A"] + score_114_1["自然"];
        score_114_3["國文、數學B、社會"] = score_114_1["國文"] + score_114_1["數學B"] + score_114_1["社會"];
        score_114_3["國文、數學B、自然"] = score_114_1["國文"] + score_114_1["數學B"] + score_114_1["自然"];
        score_114_3["國文、社會、自然"] = score_114_1["國文"] + score_114_1["社會"] + score_114_1["自然"];
        score_114_3["英文、數學A、社會"] = score_114_1["英文"] + score_114_1["數學A"] + score_114_1["社會"];
        score_114_3["英文、數學A、自然"] = score_114_1["英文"] + score_114_1["數學A"] + score_114_1["自然"];
        score_114_3["英文、數學B、社會"] = score_114_1["英文"] + score_114_1["數學B"] + score_114_1["社會"];
        score_114_3["英文、數學B、自然"] = score_114_1["英文"] + score_114_1["數學B"] + score_114_1["自然"];
        score_114_3["英文、社會、自然"] = score_114_1["英文"] + score_114_1["社會"] + score_114_1["自然"];
        score_114_3["數學A、社會、自然"] = score_114_1["數學A"] + score_114_1["社會"] + score_114_1["自然"];
        score_114_3["數學B、社會、自然"] = score_114_1["數學B"] + score_114_1["社會"] + score_114_1["自然"];

        // 4科成績總和
        score_114_4["國文、英文、數學A、社會"] = score_114_1["國文"] + score_114_1["英文"] + score_114_1["數學A"] + score_114_1["社會"];
        score_114_4["國文、英文、數學A、自然"] = score_114_1["國文"] + score_114_1["英文"] + score_114_1["數學A"] + score_114_1["自然"];
        score_114_4["國文,英文、數學B、社會"] = score_114_1["國文"] + score_114_1["英文"] + score_114_1["數學B"] + score_114_1["社會"];
        score_114_4["國文、英文、數學B、自然"] = score_114_1["國文"] + score_114_1["英文"] + score_114_1["數學B"] + score_114_1["自然"];
        score_114_4["國文、英文、社會、自然"] = score_114_1["國文"] + score_114_1["英文"] + score_114_1["社會"] + score_114_1["自然"];
        score_114_4["國文、數學A、社會、自然"] = score_114_1["國文"] + score_114_1["數學A"] + score_114_1["社會"] + score_114_1["自然"];
        score_114_4["國文、數學B、社會、自然"] = score_114_1["國文"] + score_114_1["數學B"] + score_114_1["社會"] + score_114_1["自然"];
        score_114_4["英文、數學A、社會、自然"] = score_114_1["英文"] + score_114_1["數學A"] + score_114_1["社會"] + score_114_1["自然"];
        score_114_4["英文、數學B、社會、自然"] = score_114_1["英文"] + score_114_1["數學B"] + score_114_1["社會"] + score_114_1["自然"];

        // 使用整合的非同步讀取進度條包裝 API 請求
        await runWithProgressModal(async () => {

      function lockButton(buttonId) {

      function submitCheckbox(score_114_1 , score_114_2, score_114_3, score_114_4, data_114, data_113, data_112) {
        ans = [];
        let checkedOptions = document.querySelectorAll('#checkboxForm input[name="option"]:checked');
        
        if(document.getElementById('option3').checked && document.getElementById('option4').checked) {
          return alert("數學A 與 數學B 無法同時選擇");
        }
        else if(checkedOptions.length == 0) {
          return alert("請選擇科目\n最少 1 科 至多 4 科");
        }
        else if(checkedOptions.length > 4 ) {
          return alert("請選擇科目選擇至多 4 科");
        }
        else {
          checkedOptions.forEach(option => {
            ans.push(option.value);
          });
        }

        choose = ans.join("、");
        document.querySelector("#Choose").textContent = choose;
        
        renew(checkedOptions.length, choose, score_114_1 , score_114_2, score_114_3, score_114_4, data_114, data_113, data_112);
      }
      
      function renew(num, choose, score114_1 , score114_2, score114_3, score114_4, data_114, data_113, data_112) {
        var table114=[{score:"",people:"",pr:""}, {score:"",people:"",pr:""}, {score:"",people:"",pr:""}];
        var table113=[{score:"",people:"",pr:""}, {score:"",people:"",pr:""}, {score:"",people:"",pr:""}];
        var table112=[{score:"",people:"",pr:""}, {score:"",people:"",pr:""}, {score:"",people:"",pr:""}];
        
        switch (num) {
          case 1: {
            var mainscore_114 = score_114_1[choose];
            var mainscore_113 = 15;
            var mainscore_112 = 15;
            for (let i = 0; i <= 15; i++) {
              if (Number(data_113[0][choose][i]["people"]) >= Number(data_114[0][choose][15-score_114_1[choose]]["people"]) && score_114_1[choose]!= 0) {
                mainscore_113 = i;
                break;
              }
            }
            for (let i = 0; i <= 15; i++) {
              if (Number(data_112[0][choose][i]["people"]) >= Number(data_114[0][choose][15-score_114_1[choose]]["people"]) && score_114_1[choose]!=0) {
                mainscore_112 = i;
                break;
              }
            }
            pushscore(15-mainscore_114, 15, table114, data_114[0]);
            pushscore(mainscore_113, 15, table113, data_113[0]);
            pushscore(mainscore_112, 15, table112, data_112[0]);
            changecolor(15-mainscore_114, 15, reids114);
            changecolor(mainscore_113, 15, reids113);
            changecolor(mainscore_112, 15, reids112);
            break;       
          }
          case 2: {
            var mainscore_114 = score_114_2[choose];
            var mainscore_113 = 30;
            var mainscore_112 = 30;
            for (let i = 0; i <= 30; i++) {
              if (Number(data_113[1][choose][i]["people"]) >= Number(data_114[1][choose][30-score_114_2[choose]]["people"]) && score_114_2[choose]!=0) {
                mainscore_113 = i;
                break;
              }
            }
            for (let i = 0; i <= 30; i++) {
              if (Number(data_112[1][choose][i]["people"]) >= Number(data_114[1][choose][30-score_114_2[choose]]["people"]) && score_114_2[choose]!=0) {
                mainscore_112 = i;
                break;
              }
            }
            pushscore(30-mainscore_114, 30, table114, data_114[1]);
            pushscore(mainscore_113, 30, table113, data_113[1]);
            pushscore(mainscore_112, 30, table112, data_112[1]);
            changecolor(30-mainscore_114, 30, reids114);
            changecolor(mainscore_113, 30, reids113);
            changecolor(mainscore_112, 30, reids112);
            break;
          }
          case 3: {
            var mainscore_114 = score_114_3[choose];
            var mainscore_113 = 45;
            var mainscore_112 = 45;
            for (let i = 0; i <= 45; i++) {
              if (Number(data_113[2][choose][i]["people"]) >= Number(data_114[2][choose][45-score_114_3[choose]]["people"]) && score_114_3[choose]!=0) {
                mainscore_113 = i;
                break;
              }
            }
            for (let i = 0; i <= 45; i++) {
              if (Number(data_112[2][choose][i]["people"]) >= Number(data_114[2][choose][45-score_114_3[choose]]["people"]) && score_114_3[choose]!=0) {
                mainscore_112 = i;
                break;
              }
            }
            pushscore(45-mainscore_114, 45, table114, data_114[2]);
            pushscore(mainscore_113, 45, table113, data_113[2]);
            pushscore(mainscore_112, 45, table112, data_112[2]);
            changecolor(45-mainscore_114, 45, reids114);
            changecolor(mainscore_113, 45, reids113);
            changecolor(mainscore_112, 45, reids112);
            break;
          }
          case 4: {
            var mainscore_114 = score_114_4[choose];
            var mainscore_113 = 60;
            var mainscore_112 = 60;
            for (let i = 0; i <= 60; i++) {
              if (Number(data_113[3][choose][i]["people"]) >= Number(data_114[3][choose][60-score_114_4[choose]]["people"]) && score_114_4[choose]!=0) {
                mainscore_113 = i;
                break;
              }
            }
            for (let i = 0; i <= 60; i++) {
              if (Number(data_112[3][choose][i]["people"]) >= Number(data_114[3][choose][60-score_114_4[choose]]["people"]) && score_114_4[choose]!=0) {
                mainscore_112 = i;
                break;
              }
            }
            pushscore(60-mainscore_114, 60, table114, data_114[3]);
            pushscore(mainscore_113, 60, table113, data_113[3]);
            pushscore(mainscore_112, 60, table112, data_112[3]);
            changecolor(60-mainscore_114, 60, reids114);
            changecolor(mainscore_113, 60, reids113);
            changecolor(mainscore_112, 60, reids112);
            break;
          }
        }
        var j=0;
        for(let i=0; i<12; i=i+4) {
          document.querySelector(reids114[i]).textContent = "115";
          document.querySelector(reids114[i+1]).textContent = table114[j].score;
          document.querySelector(reids114[i+2]).textContent = table114[j].people;
          document.querySelector(reids114[i+3]).textContent = table114[j].pr;

          document.querySelector(reids113[i]).textContent = "114";
          document.querySelector(reids113[i+1]).textContent = table113[j].score;
          document.querySelector(reids113[i+2]).textContent = table113[j].people;
          document.querySelector(reids113[i+3]).textContent = table113[j].pr;

          document.querySelector(reids112[i]).textContent = "113";          
          document.querySelector(reids112[i+1]).textContent = table112[j].score;
          document.querySelector(reids112[i+2]).textContent = table112[j].people;
          document.querySelector(reids112[i+3]).textContent = table112[j++].pr;
        }
      }

      function pushscore(index, maxscore, changetable, data) {
        let ans = maxscore-index;
        if(ans == maxscore) {
          changetable[0].score=ans;
          changetable[1].score=ans-1;
          changetable[2].score=ans-2;
          changetable[0].people=data[choose][index]["people"];
          changetable[1].people=data[choose][index+1]["people"];
          changetable[2].people=data[choose][index+2]["people"];
          changetable[0].pr=data[choose][index]["pr"];
          changetable[1].pr=data[choose][index+1]["pr"];
          changetable[2].pr=data[choose][index+2]["pr"];
        }
        else if(ans == 0) {
          changetable[0].score=ans+2;
          changetable[1].score=ans+1;
          changetable[2].score=ans;
          changetable[0].people=data[choose][index-2]["people"];
          changetable[1].people=data[choose][index-1]["people"];
          changetable[2].people=data[choose][index]["people"];
          changetable[0].pr=data[choose][index-2]["pr"];
          changetable[1].pr=data[choose][index-1]["pr"];
          changetable[2].pr=data[choose][index]["pr"];
        }
        else {
          changetable[0].score=ans+1;
          changetable[1].score=ans;
          changetable[2].score=ans-1;
          changetable[0].people=data[choose][index-1]["people"];
          changetable[1].people=data[choose][index]["people"];
          changetable[2].people=data[choose][index+1]["people"];
          changetable[0].pr=data[choose][index-1]["pr"];
          changetable[1].pr=data[choose][index]["pr"];
          changetable[2].pr=data[choose][index+1]["pr"];
        }
      }

      function changecolor(index, maxscore, reids) {
        let ans = maxscore-index;
        if(ans == maxscore) {
          document.querySelector(reids[0]).style.color = "red";
          document.querySelector(reids[1]).style.color = "red";
          document.querySelector(reids[2]).style.color = "red";
          document.querySelector(reids[3]).style.color = "red";
        }
        else if(ans == 0) {
          document.querySelector(reids[8]).style.color = "red";
          document.querySelector(reids[9]).style.color = "red";
          document.querySelector(reids[10]).style.color = "red";
          document.querySelector(reids[11]).style.color = "red";

        else {

          document.querySelector(reids[6]).style.color = "red";
          document.querySelector(reids[7]).style.color = "red";
        }
      }
